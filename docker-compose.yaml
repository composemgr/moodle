# nginx proxy address - http://172.17.0.1:8091

name: moodle
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  app:
    image: bitnami/moodle:latest
    pull_policy: always
    container_name: moodle-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - moodle
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8091:8080"
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: moodle-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      MOODLE_DATABASE_HOST: moodle-db
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_NAME: ${DB_CREATE_DATABASE_NAME:-moodle}
      MOODLE_DATABASE_USER: ${DB_USER_NAME:-moodle}
      MOODLE_DATABASE_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MOODLE_USERNAME: ${APP_ADMIN_USER:-administrator}
      MOODLE_PASSWORD: ${APP_ADMIN_PASS:-changeme_admin_password}
      MOODLE_EMAIL: ${APP_ADMIN_USER:-admin@example.com}
      MOODLE_SITE_NAME: ${APP_SITE_NAME:-Moodle}
    volumes:
      - ./volumes/data/moodle:/bitnami/moodle
      - ./volumes/data/moodledata:/bitnami/moodledata
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://moodle-app:8080'
      - 'cloudflare.hostname=moodle.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.moodle-app.entrypoints=http'
      - 'traefik.http.routers.moodle-app-secure.tls=true'
      - 'traefik.http.routers.moodle-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.moodle-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.moodle-app.middlewares=moodle-app-https-redirect'
      - 'traefik.http.routers.moodle-app-secure.entrypoints=https'
      - 'traefik.http.routers.moodle-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.moodle-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.moodle-app-secure.service=moodle-app'
      - 'traefik.http.services.moodle-app.loadbalancer.server.port=8080'

  db:
    image: mariadb:latest
    pull_policy: always
    container_name: moodle-db
    hostname: moodle-db
    restart: always
    logging: *default-logging
    networks:
      - moodle
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: moodle-db
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-moodle}
      MARIADB_USER: ${DB_USER_NAME:-moodle}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - ./volumes/data/db/mariadb/moodle:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  moodle:
    name: moodle
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
